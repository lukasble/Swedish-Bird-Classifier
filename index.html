<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Species Classifier</title>
    <link rel="stylesheet" href="styles.css">
    <!-- ONNX Runtime Web CDN -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <!-- Meyda Audio Feature Extraction for STFT / Spectrogram -->
    <script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <button id="lang-toggle-btn" class="lang-btn">Språk: Svenska</button>
        <header>
            <h1 id="app-title">🦅 Bird Species Classifier</h1>
            <p id="app-subtitle">Ladda upp en ljudfil (.wav eller .mp3) för att identifiera fågelarten direkt i din webbläsare.</p>
        </header>

        <main>
            <div id="status" class="status-box">Laddar AI-modell...</div>

            <section class="upload-section">
                <input type="file" id="audio-input" accept="audio/*" disabled>
                <audio id="audio-player" controls style="display: none;"></audio>
            </section>

            <section id="results" class="results-section" style="display: none;">
                <h2><span id="lbl-top-match">Bästa matchning:</span> <span id="top-species">---</span></h2>
                <p><span id="lbl-confidence">Sannolikhet:</span> <strong id="top-confidence">0%</strong></p>
                
                <div class="chart-container">
                    <canvas id="confidence-chart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
